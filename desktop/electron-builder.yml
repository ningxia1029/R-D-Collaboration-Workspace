# PLM 研发协同平台 —— electron-builder 配置（portable 免安装）
appId: com.plm.workspace
productName: PLM-Workspace
copyright: Copyright © 2026

directories:
  output: dist

# asar 关闭：内置 Next server 需通过 ELECTRON_RUN_AS_NODE 以纯 Node 运行，
# 而 Node 无法读取 asar 虚拟文件系统；便携工具无需代码混淆保护，直接放磁盘最可靠。
asar: false

files:
  - desktop/main.js
  - desktop/preload.js
  - desktop/config-preload.js
  - desktop/config.html
  - desktop/updater.js
  - desktop/icon.ico
  - builtin-env.json
  - package.json
  - .next/standalone/**/*

win:
  target:
    - portable
  icon: desktop/icon.ico
  # 正式发布由 CI 注入 CSC_LINK/CSC_KEY_PASSWORD；未签名产物只能用于本地验收。
  signingHashAlgorithms:
    - sha256
  verifyUpdateCodeSignature: true

portable:
  artifactName: "PLM平台-${version}-便携版.exe"

npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
